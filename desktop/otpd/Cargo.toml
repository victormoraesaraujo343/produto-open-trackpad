[package]
name = "otpd"
version = "0.3.0"
edition = "2021"
description = "Serviço do OpenTrackpad no computador (Linux)"
license = "MIT"

[dependencies]
evdev = "0.13"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[dev-dependencies]
